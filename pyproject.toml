[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-ml"
version = "1.0.0"
description = "Heart Disease Prediction using ML"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "shap>=0.45",
    "pandas>=2.1",
    "numpy>=1.26",
    "joblib>=1.3",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "streamlit>=1.30",
    "ucimlrepo>=0.0.7",
    "kagglehub>=0.2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "nbformat>=5.9",
    "types-PyYAML",
    "types-requests",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["A001", "A002", "A003"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "xgboost.*",
    "shap.*",
    "streamlit.*",
    "ucimlrepo.*",
    "kagglehub.*",
    "joblib.*",
    "matplotlib.*",
    "seaborn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

