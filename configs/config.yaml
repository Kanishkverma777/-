project:
  name: heart-disease-ml
  version: "1.0.0"
  random_seed: 42

data:
  uci_dataset_id: 45
  kaggle_dataset_slug: redwankarimsony/heart-disease-data
  raw_dir: data/raw
  raw_file: heart_disease_uci.csv
  test_size: 0.2
  target_column: num
  missing_markers:
    - "?"
    - "-9"

features:
  numeric:
    - age
    - trestbps
    - thalach
    - oldpeak
  categorical:
    - sex
    - cp
    - restecg
    - exang

training:
  cv_folds: 5
  cv_repeats: 10
  n_iter: 50
  scoring: roc_auc
  target_recall: 0.90
  decision_threshold: 0.5

selection:
  primary_metric: roc_auc
  tolerance_std_factor: 1.0
  tie_breakers:
    - lower_std
    - simplicity
  simplicity_order:
    - logistic_regression
    - random_forest
    - xgboost

ablation:
  cv_std_factor: 1.0
  loso_auc_tolerance: 0.01  # LOSO AUC within 0.01 counts as "not worse"

models:
  logistic_regression:
    param_grid:
      classifier__C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
      classifier__penalty: ["l2"]
      classifier__solver: ["lbfgs"]
      classifier__max_iter: [2000]
  random_forest:
    param_grid:
      classifier__n_estimators: [100, 200, 300, 500]
      classifier__max_depth: [3, 5, 7, 10, null]
      classifier__min_samples_split: [2, 5, 10]
      classifier__min_samples_leaf: [1, 2, 4]
      classifier__max_features: ["sqrt", "log2"]
  xgboost:
    param_grid:
      classifier__n_estimators: [100, 200, 300, 500]
      classifier__max_depth: [3, 5, 7, 9]
      classifier__learning_rate: [0.01, 0.05, 0.1, 0.2]
      classifier__subsample: [0.6, 0.8, 1.0]
      classifier__colsample_bytree: [0.6, 0.8, 1.0]
      classifier__min_child_weight: [1, 3, 5]
      classifier__gamma: [0.0, 0.1, 0.3]

paths:
  models_dir: models
  reports_dir: reports

app:
  risk_thresholds:
    low: 0.20
    moderate: 0.50
    elevated: 0.75
  display_min_probability: 0.01
  display_max_probability: 0.99

